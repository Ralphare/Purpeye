name: Security Scan

# Runs the security pipeline on every push and pull request to main,
# plus a weekly scheduled run so new CVEs in dependencies get caught
# even when the code hasn't changed.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

# Least-privilege token: read the code, write security results to the
# Security tab. Nothing else.
permissions:
  contents: read
  security-events: write

jobs:
  # ------------------------------------------------------------------
  # 0. Unit tests: the checks must still behave correctly
  # ------------------------------------------------------------------
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest tests.test_checks -v

  # ------------------------------------------------------------------
  # 1. SAST — finds vulnerable patterns in YOUR source code
  #    (SQLi, command injection, unsafe deserialization, etc.)
  # ------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (report)
        # --config=auto pulls community rulesets matched to your languages.
        # --sarif writes every finding (any severity) for the Security tab.
        # This step reports only; the gate is the next step.
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep gate (fail on ERROR-severity findings)
        # semgrep exits 0 even when it finds issues unless --error is set.
        # Gating on ERROR only keeps low-confidence warnings from blocking
        # merges, matching the CRITICAL/HIGH gate used for Trivy below.
        run: semgrep scan --config=auto --severity ERROR --error

  # ------------------------------------------------------------------
  # 2. Dependency scanning — finds known CVEs in the packages you import
  #    (the vulnerable-library problem, not your own code)
  # ------------------------------------------------------------------
  dependencies:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # Fails the job if any dependency has a known vulnerability.
        run: pip-audit -r requirements.txt --desc

  # ------------------------------------------------------------------
  # 3. Secret scanning — catches API keys / tokens / passwords
  #    accidentally committed anywhere in the repo history
  # ------------------------------------------------------------------
  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so it scans past commits too

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 4. Container / filesystem scanning — finds CVEs in OS packages and
  #    dependencies. Runs in filesystem mode by default (no Docker needed).
  #    If you have a Dockerfile, see the notes to switch to image mode.
  # ------------------------------------------------------------------
  container:
    name: Container/FS Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        # Pinned to a commit SHA (v0.36.0), not a branch: a moving ref like
        # @master would let an upstream compromise run in this pipeline.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'   # fail the build on CRITICAL/HIGH findings

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
